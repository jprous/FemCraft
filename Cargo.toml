[workspace]
resolver = "2"
members = ["apps/femcraft", "crates/*"]
default-members = ["apps/femcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jprous/FemCraft"
publish = false

[workspace.dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
femcraft-model = { path = "crates/femcraft-model" }
femcraft-rfdb = { path = "crates/femcraft-rfdb" }
femcraft-render = { path = "crates/femcraft-render" }
femcraft-ui = { path = "crates/femcraft-ui" }
femcraft-aster = { path = "crates/femcraft-aster" }
femcraft-results = { path = "crates/femcraft-results" }

[profile.dev.package."*"]
# Optimise dependencies even in debug builds so the viewport stays smooth.
opt-level = 2
